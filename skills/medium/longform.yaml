# medium long-form rules — machine-readable (#266)
#
# Read by `pasco post task|check|export` when the seed is `format: longform`.
# The word range is an EDITORIAL default (the operator's house style), NOT a
# platform limit: cite a platform source before encoding a hard cap here.

platform: medium
format: longform
export: api
settings:
  __type: medium
fields:
  required:
    - title
    - dek
  optional:
    - tags
    - canonical
limits:
  words:
    min: 600
    max: 3000
links:
  policy: identity-ssot-only
structure:
  - title
  - dek
  - sections
sources:
  - url: https://github.com/Medium/medium-api-docs
    date: 2026-10-29
    note: "Medium's posting API takes the title, tags and canonical URL in the post payload; the body is markdown."
