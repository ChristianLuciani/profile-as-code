# checks.yaml — criterios machine-readable para `pasco check github-org`
# (unión con content/checks.yaml del workspace; misma rule catalog que el schema).
# v1.1/§17: handle-claimed y handle-consistent se EJECUTAN offline en pasco check
# (drift codes); url-live es la verificación de red (skill, no drift).

- id: org-handle-claimed
  platform: github-org
  rule: handle-claimed
  value: true
  note: "Todo handle claimed debe resolver a una URL (offline: drift/handle-claimed-not-linked; live: url-live)."

- id: org-handle-consistent
  platform: github-org
  rule: handle-consistent
  value: true
  note: "La handle matrix es el SSOT: una fila por plataforma, hosts correctos (offline: drift/duplicate-handle, drift/handle-host-mismatch)."

- id: org-mission-identity
  platform: github-org
  rule: fact-present
  value: true
  note: "El README que escribió `pasco build` se compara contra el render actual del SSOT en los dos sentidos — URL, fecha o número agregado u omitido, y texto sin token que lo explique (WARN, D12; `pasco audit` lo gradúa). `link-in-identity` es una premisa aparte."

- id: org-links-identity
  platform: github-org
  rule: link-in-identity
  value: true
  note: "Toda URL del README vive en identity.links o socialHandles[].url (regla drift, §17.1)."

- id: org-jsonld-org
  platform: github-org
  rule: geo-consistent
  value: true
  note: "JSON-LD schema.org/Organization: @id = el link con role: identity (ausente si no hay ninguno), sameAs = links con role: realization + claimed handles (GEO, v1.6/#103, §15.4)."

- id: org-cta-one
  platform: github-org
  rule: lang-present
  value: en
  note: "EN requerido (D8/§11); un CTA primario por variante (suscribirse al newsletter)."
