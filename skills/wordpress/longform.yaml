# wordpress long-form rules — machine-readable (#266)
#
# Read by `pasco post task|check|export` when the seed is `format: longform`.
# The word range is an EDITORIAL default (the operator's house style), NOT a
# platform limit: cite a platform source before encoding a hard cap here.

platform: wordpress
format: longform
export: api
settings:
  __type: wordpress
fields:
  required:
    - title
    - dek
  optional:
    - tags
    - canonical
    - publication
limits:
  words:
    min: 600
    max: 3000
links:
  policy: identity-ssot-only
structure:
  - title
  - dek
  - sections
sources:
  - url: https://developer.wordpress.org/rest-api/reference/posts/
    date: 2026-10-29
    note: "The WordPress REST posts endpoint takes title, content, tags and an excerpt."
