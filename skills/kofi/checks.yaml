# checks.yaml — criterios machine-readable para `pasco check kofi`
# (unión con content/checks.yaml del workspace; misma rule catalog que el schema).
#
# Fuente de los valores: research/SOTA-2026.md (todas las fuentes fechadas
# 2026-10-05). Ko-fi NO documenta límite para el About [?] — el max-chars es
# soft-cap curacional, no hard rule (SOTA-2026 §1).

- id: k-bio-soft
  platform: kofi
  rule: max-chars
  value: 500
  note: "Soft-cap curacional del About — Ko-fi no documenta límite [?]; el card trunca con 'Show more' (SOTA-2026 §1, S12)."

- id: k-facts-identity
  platform: kofi
  rule: fact-present
  value: true
  note: "El About que escribió `pasco build` se compara contra el render actual del SSOT en los dos sentidos — URL, fecha o número agregado u omitido, y texto sin token que lo explique (WARN, D12; `pasco audit` lo gradúa); el About es el cuerpo del perfil (SOTA-2026 §5). `link-in-identity` es una premisa aparte."

- id: k-links-identity
  platform: kofi
  rule: link-in-identity
  value: true
  note: "El URL canónico ko-fi.com/<handle> vive en identity.links; host único con guion — kofi.com NO resuelve (SOTA-2026 §3, S17)."

- id: k-geo-consistent
  platform: kofi
  rule: geo-consistent
  value: true
  note: "Hechos consistentes con CV/LinkedIn/GitHub = citabilidad; el About es legible por LLMs con fetcher browser (SOTA-2026 §5)."

- id: k-live
  platform: kofi
  rule: url-live
  value: true
  note: "Página resuelve en browser — Cloudflare 403 para fetchers planos; verificación live con browser (SOTA-2026 §5)."

- id: k-lang
  platform: kofi
  rule: lang-present
  value: en
  note: "EN requerido (D8/§11); compile no hace fallback por fila de bios — artefacto vacío = gap visible."