# platforms/registry.yaml — the machine-readable platform registry (issue #154).
#
# WHY THIS FILE EXISTS
# --------------------
# Per-platform *metadata* had no single home: one fact ("hotmart is a paste
# platform in the creator-monetization family whose host is hotmart.com") lived
# hand-written in ≥7 surfaces, and PR #146 edited 24 files for one platform.
# This registry is now the ONE data home for that metadata. The reviewed
# contract is unchanged: `schema/profile.schema.json` keeps `$defs.platform.enum`
# (hand-edited, D3) — this file never owns the constraint, only the metadata.
#
# WHAT IS GENERATED FROM IT (never edit the outputs by hand)
# ----------------------------------------------------------
#   node scripts/gen-platforms/gen.mjs            # pnpm gen:platforms
#     ├── packages/core/src/generated/platforms.gen.ts   host maps + slug list
#     ├── docs/SPEC.md  block between `<!-- gen:platform-families -->` … `<!-- /gen -->`
#     └── README.md     block between `<!-- gen:platform-status -->` … `<!-- /gen -->`
#
# CI (scripts/schema-check/check.py and `gen.mjs --check`) asserts
# registry ↔ schema enum ↔ generated all agree, naming the exact pair that
# drifts. Prose in SPEC/README *outside* the markers stays hand-authored.
#
# FIELD CONTRACT (one entry per slug — members AND backlog; every enum member
# MUST be here as `status: member`)
# -----------------------------------------------------------------------
#   status           member | backlog (REQUIRED). `member` = a real enum entry;
#                    `backlog` = declared but NOT an enum entry (verify the
#                    official eligibility page before any claim). Backlog entries
#                    carry only family + note + sources.
#   family           optional family id (see `families:`); absent = un-bucketed
#   origin           postiz | extra — Postiz parity vs operator extra (D16)
#                    [member only]
#   since            version the slug entered the enum (v1 … v1.9) [member only]
#   issue            optional GitHub issue that added it
#   deploy           git | api | manual (D9) [member only] — the declared deploy
#                    kind. `manual` is the checklist default for a platform with
#                    no evidenced profile-body API. For a slug with a renderer
#                    this MUST equal that renderer's `pasco.deploySpec` (#165).
#   hosts            apex hosts that are platform surfaces (drift PLATFORM_HOSTS)
#                    [member only]
#   subdomain_hosts  hosts whose SUBDOMAINS are profile surfaces [member only]
#   handle_hosts     expected hosts for socialHandles URLs; [] = any host allowed
#                    [member only]
#   renderer         true iff a renderer manifest declares this platform (#165)
#                    [member only]. `false` is the explicit "not implemented yet"
#                    the reverse assert requires — never a silent gap.
#   fixture          optional test workspace under packages/core/tests/fixtures/
#   note             optional short annotation rendered into the SPEC family table
#   sources          REQUIRED — where the facts were verified (evidence rule)
version: 1

# Postiz parity baseline (D16): the union is Postiz's supported networks plus
# operator extras. `count` is Postiz's own published number — a fact, not derived.
postiz:
  count: 34
  source: "[OFICIAL] docs.postiz.com llms.txt, fetched 2026-09-02"

# Families are declared docs-first (issue #138) — prose labels, never a hard
# schema field. Membership is derived from each platform entry's `family`.
families:
  creator-monetization:
    display: Creator monetization platforms
    purpose: "audience pays for content, memberships or works (declared v1.8, #133)"
  freelance:
    display: Freelance marketplaces
    purpose: client-facing surfaces — the product is the operator's professional time
  job-boards:
    display: Recruiting surfaces
    purpose: "recruiter-facing CV surfaces — the buyer is a recruiter and the native content is the structured CV the SSOT already models (`experience[]` / `education[]` / `skills[]`); GEO hook = name-reputation in search results only"

