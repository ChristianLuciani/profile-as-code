# ── ai — the AI crawler policy (M9 floor, issue #290) ────────────────────────
#
# The policy is DERIVED DATA, never a committed artifact of a user's workspace:
# `pasco export ai-policy --out <dir>` writes robots.txt + llms.txt +
# AI-POLICY.md, and `--check` fails when an entry is unsourced or its `as_of` is
# older than 180 days. `pnpm gen:platforms` projects this block into
# `packages/core/src/generated/ai-policy.gen.ts` and the SPEC §7.3 table — a
# hardcoded UA list in the CLI would rot without a failing command.
#
# FIELD CONTRACT (one entry per robots.txt token):
#   family     retrieval | training (REQUIRED). retrieval = the crawlers whose
#              output is a citation (search/answer indexing, and fetches a user
#              asked for); training = foundation-model corpus crawlers.
#   ua         the robots.txt User-agent token, verbatim (REQUIRED, unique).
#   operator   the company/foundation that runs it (REQUIRED).
#   source     that operator's OWN page documenting the token (REQUIRED, http(s)).
#   as_of      the ISO date that page was read (REQUIRED). Classification from
#              memory is what this block exists to prevent: no source, no entry.
#
# `policy.stance` MUST appear verbatim in docs/SPEC.md — `gen.mjs` refuses a
# drift between the registry's stated position and the SPEC's §12 M9 floor (the
# generated AI-POLICY.md quotes it, so a second copy cannot diverge).
ai:
  policy:
    version: 1
    as_of: 2026-10-27
    stance: '**private-first default**: `robots.txt` on published surfaces **blocks** AI-training crawlers (CCBot / vendor AI crawlers) and user data ships **without** an open license; entering corpora or open-licensing data requires the profile owner''s explicit opt-in (consent field — schema work deferred with Q10).'
  crawlers:
    # ── retrieval — allowed: the output is a citation ────────────────────────
    googlebot:
      ua: Googlebot
      family: retrieval
      operator: Google
      source: https://developers.google.com/crawling/docs/crawlers-fetchers/google-common-crawlers
      as_of: 2026-10-27
    oai-searchbot:
      ua: OAI-SearchBot
      family: retrieval
      operator: OpenAI
      source: https://developers.openai.com/api/docs/bots
      as_of: 2026-10-27
    chatgpt-user:
      ua: ChatGPT-User
      family: retrieval
      operator: OpenAI
      source: https://developers.openai.com/api/docs/bots
      as_of: 2026-10-27
    perplexitybot:
      ua: PerplexityBot
      family: retrieval
      operator: Perplexity
      source: https://docs.perplexity.ai/docs/resources/perplexity-crawlers
      as_of: 2026-10-27
    perplexity-user:
      ua: Perplexity-User
      family: retrieval
      operator: Perplexity
      source: https://docs.perplexity.ai/docs/resources/perplexity-crawlers
