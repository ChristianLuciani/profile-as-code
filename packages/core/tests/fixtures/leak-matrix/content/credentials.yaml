# The D27 leak matrix — one `public` row plus every way a row can be
# NON-public per visibility-carrying block: `private`, `unlisted`, and the
# absent field (v2.0 default = private). Every non-public value carries a
# marker (`PRIVATE-`, `UNLISTED-`, `ABSENT-`) and every non-public row an id
# prefixed `secret-`/`unlisted-`/`absent-`: a public surface that emits one of
# these strings is a leak (issue #498/S4c).
- id: pub-cred
  kind: certificate
  title: PUBLIC-CRED-TITLE
  issuer: Public Issuer
  visibility: public

- id: secret-cred
  kind: award
  title: PRIVATE-CRED-TITLE
  issuer: PRIVATE-CRED-ISSUER
  visibility: private

- id: unlisted-cred
  kind: award
  title: UNLISTED-CRED-TITLE
  issuer: Unlisted Issuer
  visibility: unlisted
