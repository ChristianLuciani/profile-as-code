# The D27 leak matrix — a `public` row plus EVERY non-public state the schema
# can represent for the block: `private`, `unlisted`, and the omitted field
# (v2.0 default = private). Each non-public value carries a marker
# (`PRIVATE-`/`UNLISTED-`/`ABSENT-`), each row an id prefixed
# `secret-`/`unlisted-`/`absent-`, and a public surface that emits one of these
# strings is a leak (issue #498/S4c). `packages/cli/tests/visibility-leak.test.ts`
# derives this block × state matrix from the fixture, so the prose cannot outrun it.
- id: pub-cred
  kind: certificate
  title: PUBLIC-CRED-TITLE
  issuer: Public Issuer
  visibility: public

- id: secret-cred
  kind: award
  title: PRIVATE-CRED-TITLE
  issuer: PRIVATE-CRED-ISSUER
  visibility: private

- id: unlisted-cred
  kind: award
  title: UNLISTED-CRED-TITLE
  issuer: UNLISTED-CRED-ISSUER
  visibility: unlisted

- id: absent-cred
  kind: award
  title: ABSENT-CRED-TITLE
  issuer: ABSENT-CRED-ISSUER
  # No `visibility`: the v2.0 default makes this row private.
