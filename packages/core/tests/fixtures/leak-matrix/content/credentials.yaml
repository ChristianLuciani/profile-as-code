# The D27 leak matrix — one `public` and one `private` row per
# visibility-carrying block. Every private value carries the `PRIVATE-` marker:
# a public surface that emits one of these strings is a leak (issue #498/S4c).
- id: pub-cred
  kind: certificate
  title: PUBLIC-CRED-TITLE
  issuer: Public Issuer
  visibility: public

- id: secret-cred
  kind: award
  title: PRIVATE-CRED-TITLE
  issuer: PRIVATE-CRED-ISSUER
  visibility: private
