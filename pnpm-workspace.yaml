packages:
  - packages/*
  - packages/renderers/*

# GHSA-g7r4-m6w7-qqqr (arbitrary file read via dev server on Windows) is patched
# in esbuild 0.28.1. tsup/bundle-require auto-installed the vulnerable 0.27.7
# peer into pnpm-lock.yaml, and Dependabot (npm ecosystem) cannot bump transitive
# deps pinned there — its security update failed with `security_update_not_possible`
# (issue #57). The override lifts every esbuild resolution to the first patched
# version; future bumps ride tsup/vite updates or the weekly manual review.
# Note: pnpm overrides replace dependency ranges globally, including direct
# pins (e.g. vite's exact esbuild). Identical resolution today (0.28.1 is the
# only matching version); CI gates catch any breakage on the next refresh.
overrides:
  esbuild: ">=0.28.1"
  # #160: same class as esbuild — source-map-js is transitive (postcss) and pinned
  # at 1.2.1 in pnpm-lock.yaml; the advisory is fixed in 1.2.2 ([OFICIAL]
  # Dependabot alerts API 2026-10-07: vulnerable ">= 1.0.0, < 1.2.2",
  # first_patched_version 1.2.2; published 2026-09-30). Dependabot cannot bump a
  # transitive dep pinned in the lockfile (`security_update_not_possible`), so this
  # lifts every resolution to the first patched version — mirroring the esbuild
  # decision (issue #57) and paired with its `ignore` in .github/dependabot.yml.
  source-map-js: ">=1.2.2"
  # #184: chokidar is transitive (tsup's file watcher) and resolved to 4.0.3 in
  # pnpm-lock.yaml. 4.0.2/4.0.3 were published without npm provenance while
  # 4.0.0/4.0.1 carry SLSA attestations ([OFICIAL] registry.npmjs.org, 2026-10-09),
  # so `trustPolicy: no-downgrade` (below) correctly refuses the 4.0.3 resolution.
  # tsup declares `chokidar: ^4.0.3`, but 4.0.4+ does not exist and 5.0.0 is a
  # breaking, ESM-only major; the closest attested resolution is 4.0.1 — the newest
  # attested 4.x (4.0.0 is also attested, but further behind). This deliberately
  # pins BELOW tsup's declared ^4.0.3 floor; the delta is small but not types-only
  # ([OFICIAL] upstream releases + tarball diff 4.0.1↔4.0.3, 2026-10-09): it
  # refactors the emit-argument plumbing (net `(event, path, stats)` emission
  # unchanged), adds an `isFreeBSD` branch to the inode-change path (FreeBSD only),
  # and drops the source maps. tsup loads chokidar lazily for `--watch` only, so the
  # exposure is dev-time and the build does not import it; `tsup --watch` was
  # verified on 4.0.1. This pin replaces the temporary `trustPolicyExclude` shipped
  # in #182. Revisit if any consumer ever requires ^5.
  chokidar: "4.0.1"

allowBuilds:
  esbuild: true

# esbuild's postinstall fetches its platform binary (used by vitest's transform pipeline).
onlyBuiltDependencies:
  - esbuild

# Supply-chain hardening (#audit 2026-10-09).
# minimumReleaseAge: every resolution waits this many minutes after publish, so a
# freshly compromised release is usually yanked before it can be installed (pnpm's
# default is 1440 min = 1 day; 4320 = 3 days). Setting it explicitly turns strict
# enforcement ON (`minimumReleaseAgeStrict` defaults to true when configured), so an
# entry younger than the threshold FAILS the install instead of falling back — the
# Dependabot `cooldown` in .github/dependabot.yml keeps version-update PRs out of
# that window.
minimumReleaseAge: 4320
# Reject transitive deps from exotic sources — already pnpm's default since 10.26;
# stated explicitly so a future default change cannot silently weaken it.
blockExoticSubdeps: true
# Refuse a version whose trust level dropped versus earlier releases (e.g. a
# previously-attested package republished without provenance).
trustPolicy: no-downgrade
# A dependency whose declared engine range excludes the running Node fails the
# install. `engineStrict` is a pnpm setting and belongs HERE: pnpm reads `.npmrc`
# only for registry/auth keys, so the same line there is a no-op.
engineStrict: true
