name: release

# Publishes @profile-as-code/cli to npm on a version tag (issue #42).
# Provenance: id-token: write (OIDC) + repository field in packages/cli/package.json
# (issue #43). The FIRST tag push (v0.1.0) is the operator's publish action —
# pushing the tag IS publishing (issue #44); workflow_dispatch is for retries.
#
# issue #44 decision (a): npm refuses provenance from private SOURCE repos
# ([WEB] GitHub Changelog 2023-07-25), and v0.1.0 publishes BEFORE the visibility
# flip. Provenance is therefore conditional on the repo being public at run time:
# v0.1.0 goes out without it, every later tag (post-flip) gets it with no
# follow-up edit. See the Publish step.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Smoke the pipeline without publishing (skips the tag guard; does not validate NPM_TOKEN auth)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # npm provenance (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the guard compares the tagged commit against the default
      # branch tip, and ancestry is not computable from a shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Publish invariant: only a tagged, version-matched release whose COMMIT is
      # on the default branch may publish (issues #42/#43, hardened in #81).
      #
      # It lives in a script rather than inline so the invariant can be exercised
      # against a real repository (see that file's --help) instead of only being
      # imagined: the previous inline check compared the tag NAME to package.json
      # and accepted a tag pushed from a stale local main, which would publish
      # whatever that commit contained (observed 2026-09-15).
      #
      # Always runs: the script owns the dry-run behavior too, so a green dry run
      # reports which invariants were NOT enforced instead of looking equivalent.
      - name: Guard — only a tagged release on the default branch may publish
        run: node packages/cli/scripts/release-guard.mjs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run }}

      - uses: pnpm/action-setup@v6 # reads packageManager from package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # npm pack --json does not reflect the bin — verify by packing, extracting
      # and installing the tarball, then smoke-running the linked bin (issue #43).
      # Must pass before any publish.
      - name: Verify tarball exposes bin pasco
        run: pnpm --filter @profile-as-code/cli verify:pack

      # Provenance requires a public source repo ([WEB] GitHub Changelog
      # 2023-07-25); v0.1.0 is tagged while the repo is still private (issue #44
      # decision a), so it publishes without --provenance. Once flipped, the
      # same step adds the flag automatically.
      - name: Publish
        run: |
          ARGS="--access public"
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            ARGS="$ARGS --provenance"
          else
            echo "Repository is private — publishing without provenance (issue #44 decision a)."
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          npm publish $ARGS
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}