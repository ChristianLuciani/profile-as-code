name: release

# Publishes @profile-as-code/cli to npm on a version tag (issue #42).
# Provenance: id-token: write (OIDC) + repository field in packages/cli/package.json
# (issue #43). The FIRST tag push (v0.1.0) is the operator's publish action —
# pushing the tag IS publishing (issue #44); workflow_dispatch is for retries.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Never publish a tag whose version does not match packages/cli.
      - name: Guard — tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/cli/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package version $PKG — refusing to publish." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v6 # reads packageManager from package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # npm pack --json does not reflect the bin — verify by packing, extracting
      # and installing the tarball, then smoke-running the linked bin (issue #43).
      # Must pass before any publish.
      - name: Verify tarball exposes bin pasco
        run: pnpm --filter @profile-as-code/cli verify:pack

      - name: Publish
        run: npm publish --provenance --access public
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}