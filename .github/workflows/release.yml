name: release

# Publishes @profile-as-code/cli to npm and creates the matching GitHub Release from
# CHANGELOG.md (issues #42/#58). See docs/ci-cd.md §"Releasing — the primary path".
#
# WHICH TRIGGER PUBLISHES: workflow_dispatch from `main`. A `push` of a version tag
# does NOT publish. The tag run fails at the publish step — v0.3.0 with ENEEDAUTH after
# the token was deleted — while the dispatch run publishes. (v0.2.0 also failed on its
# tag run, but with E403 from the granular token's missing 2FA bypass: a different
# failure class, which cannot recur now the token is gone, so it is NOT evidence about
# the tag ref.) The tag is the ANNOUNCEMENT and the version marker: it is what makes the
# version tagged on origin, which release-guard.mjs requires. Not the publish action.
# (Issue #208. This reverses the pre-0.3.0 model, where pushing the tag WAS publishing.)
#
# A tag push is therefore expected to show a RED run, and it creates NO GitHub Release:
# the `release` job below waits on `needs: publish`, and a job whose `needs` failed is
# skipped. Both existing Release pages came from the successful dispatch run.
#
# Publish auth is trusted publishing (OIDC, issue #80). The npm CLI detects the OIDC
# environment and uses it BEFORE a traditional token ([WEB]
# docs.npmjs.com/trusted-publishers, checked 2026-09-19).
#
# There is NO token fallback any more. The OIDC exchange is written never to throw — a
# failed exchange returns undefined and leaves whatever token the config had — and that
# token is now gone: the `NPM_TOKEN` secret was deleted in npm and in GitHub after the
# v0.3.0 publish ran on OIDC with it already deleted. A failed exchange therefore no
# longer degrades to a credential; it degrades straight to ENEEDAUTH. That is what the
# tag run reports, and it is the first thing to diagnose when a publish fails.
#
# Provenance is no longer a flag we set: under OIDC npm generates the attestation on
# its own, and omits it when the SOURCE repo is private (documented limitation, not a
# failure). See the Publish step and docs/ci-cd.md for the runbook.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Smoke the pipeline without publishing (skips the tag guard; does not validate publish auth — NPM_TOKEN/OIDC)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # trusted publishing (OIDC)

# The `release` job narrows/overrides these with `contents: write` (gh release
# create) — scoped to that one job so the publish job keeps read-only contents.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Exposed so the release job can build its page from the SAME verified commit
    # (issue #58) — a release page must describe the artifact that shipped.
    outputs:
      tag: ${{ steps.guard.outputs.tag }}
      commit: ${{ steps.guard.outputs.commit }}
    steps:
      # fetch-depth: 0 — the guard compares the tagged commit against the default
      # branch tip, and ancestry is not computable from a shallow clone.
      # persist-credentials stays at its default: release-guard.mjs runs
      # `git fetch origin` and `git ls-remote origin`, which need the token on a
      # private repo (review finding on this PR).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Publish invariant: only a tagged, version-matched release whose COMMIT is
      # on the default branch may publish (issues #42/#43, hardened in #81).
      #
      # It lives in a script rather than inline so the invariant can be exercised
      # against a real repository (see that file's --help) instead of only being
      # imagined: the previous inline check compared the tag NAME to package.json
      # and accepted a tag pushed from a stale local main, which would publish
      # whatever that commit contained (observed 2026-09-15).
      #
      # Always runs: the script owns the dry-run behavior too, so a green dry run
      # reports which invariants were NOT enforced instead of looking equivalent.
      - name: Guard — only a tagged release on the default branch may publish
        id: guard
        run: node packages/cli/scripts/release-guard.mjs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run }}

      # Verifying a commit is not the same as publishing it. The guard validates
      # the TAGGED commit; without this step the retry path (workflow_dispatch
      # from a branch) would build whatever that branch's tree is while the guard
      # reported "commit verified" — a green run whose claim did not cover the
      # artifact (the #81 failure class, on the other entry point).
      #
      # Skipped on a dry run: nothing is published, and the guard deliberately
      # emits no commit there, so an empty ref cannot silently fall back.
      - if: inputs.dry_run != true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.guard.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      # reads packageManager from package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI >= 11.5.1 and Node >= 22.14
      # ([WEB] docs.npmjs.com/trusted-publishers). Node 22 ships npm 10.x, which has no
      # trusted-publishing support at all — the exchange is never attempted, so the publish
      # fails on auth without naming the real cause (observed in #80, 2026-09-15). Bump npm
      # and print the exact version so the next person debugging a failed publish can rule
      # this out at a glance.
      - name: 'Prerequisite — npm CLI >= 11.5.1 (trusted publishing)'
        run: |
          npm install -g npm@11.6.1
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # npm pack --json does not reflect the bin — verify by packing, extracting
      # and installing the tarball, then smoke-running the linked bin (issue #43).
      # Must pass before any publish.
      - name: Verify tarball exposes bin pasco
        run: pnpm --filter @profile-as-code/cli verify:pack

      # The `release` job (below) builds the GitHub Release from this version's
      # CHANGELOG.md section. Validate it BEFORE the irreversible publish: npm
      # cannot be un-published, so discovering a missing section afterwards would
      # leave the version consumed with an empty tag page — the exact symptom #58
      # removes (review finding on #58).
      - if: steps.guard.outputs.tag != ''
        name: Verify release notes exist for this version
        env:
          TAG: ${{ steps.guard.outputs.tag }}
        run: node packages/cli/scripts/release-notes.mjs --version "${TAG#v}"

      # Issue #277: the project page is deployed from THIS commit (the `site` job
      # at the bottom), so whatever it says here becomes the public description of
      # this release. Two facts can make it lie, and both are cheap to catch —
      # before the irreversible publish, not after:
      #   - the docs no longer project (renamed/moved source, broken relative link);
      #   - the page advertises a CLI version other than package.json's
      #     (`version-check.mjs`). npm cannot be un-published, so a page announcing
      #     the wrong version would be live with no way back.
      # The same projection runs again in `pages.yml` for the deploy; this step is
      # the barrier, not the deploy.
      - if: steps.guard.outputs.tag != ''
        name: Project the site and gate it (pre-publish barrier)
        run: |
          node scripts/site-docs/gen.mjs
          node scripts/site-check/check.mjs
          node scripts/site-check/version-check.mjs
        env:
          SITE_REF: ${{ steps.guard.outputs.commit }}

      # Multi-package publish (issue #301; it executes the decision recorded in
      # #259, 2026-10-21): the five seam packages publish BEFORE the CLI, in
      # dependency order — core → markdown → paste → artifact → github → cli —
      # with `pnpm publish`, which rewrites the runtime `workspace:*` dependency
      # of `paste` and `github` (verified on this workspace: the published
      # manifest reads `0.1.0`; `npm publish` does not rewrite it — leaving
      # `@profile-as-code/core@workspace:*` unresolvable in the package page's
      # manifest). The first revision of this step packed with pnpm and published
      # the tarballs with `npm publish`, on this session's belief that this pnpm
      # lacks the OIDC exchange — its round-1 review (PR #309) refuted that claim
      # against the pnpm dist itself: pnpm 11.20.0 (the `packageManager` pin)
      # ships `lib/publish/oidc/{idToken,authToken,provenance}.js` and exchanges
      # the Actions OIDC token against the registry's trusted-publishing endpoint
      # (`/-/npm/v1/oidc/token/exchange/package/…`), so `pnpm publish` performs
      # the exchange of issue #80 and the tarball detour was a needless deviation
      # from the mechanism the issue declares. Back to the recorded mechanism.
      #
      # Independent semver (the policy issue #301 declares — #259's decision
      # covers publishing the five and left the version policy open): each of the
      # six packages versions on its own (the seam at 0.1.0; the CLI on its own
      # 0.3.x line). A package whose version is already live on the registry is
      # SKIPPED, not re-published (npm cannot republish a version). An `npm view`
      # failure — a network error, say — reads as not-live, and the republish
      # attempt of a live version then fails loud (E403) — the backstop is loud,
      # not silent. The release TAG stays anchored to the CLI package — the
      # guard's invariant below is unchanged.
      - name: Publish the seam cohort (pnpm publish, in dependency order)
        run: |
          set -euo pipefail
          ORDER="core markdown paste artifact github"
          for pkg in $ORDER; do
            dir="packages/$pkg"
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$version" version --silent >/dev/null 2>&1; then
              echo "skip $name@$version — already live on the registry (independent semver)"
              continue
            fi
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              (cd "$dir" && pnpm publish --access public --no-git-checks --dry-run)
            else
              (cd "$dir" && pnpm publish --access public --no-git-checks)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Auth is OIDC-first: the npm CLI prefers the OIDC environment over
      # NODE_AUTH_TOKEN, and the OIDC path is written to NEVER throw — a failed exchange
      # returns undefined and leaves whatever token the config had (lib/utils/oidc.js, npm
      # 11.6.1). That token no longer exists: NPM_TOKEN was deleted in npm and in GitHub
      # after the v0.3.0 publish ran on OIDC. So there is no fallback left — an OIDC
      # failure now ends in ENEEDAUTH, which is exactly what a tag-triggered run reports
      # (#208). The env line below is kept but resolves to the empty string; do not
      # re-add the secret (issue #80; runbook in docs/ci-cd.md).
      #
      # No --provenance: npm decides. It attests only when the OIDC exchange succeeded, the
      # source repo is public and the package is public — so no attestation was generated
      # while the repo stayed private even though the exchange succeeded (the v0.3.0 case);
      # the repo is public since 2026-10-23 (issue #293) — the private-source limitation
      # that suppressed v0.3.0's attestation no longer applies. See docs/ci-cd.md.
      - name: Publish
        run: |
          ARGS="--access public"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          npm publish $ARGS
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # GitHub Release (issue #58). "Published to npm" and "a release page exists" are
  # two different facts: before this job the tag page was empty and STANDARDS.md
  # item 3 could not be signed off. Runs AFTER publish on purpose — a release page
  # announcing a version that never reached npm would be worse than a late page.
  release:
    needs: publish
    # Gate on the guard's output, not on `inputs`: reading `inputs` here would be an
    # assumption about the `inputs` context in a `push` run (flagged by the #58
    # fresh-context review as never exercised) — the guard's output works on both
    # entry points. On a dry run the guard emits no tag, so there is nothing to announce.
    #
    # This is also what makes a tag push create no Release: a job whose `needs` failed
    # never runs, and the tag run's `publish` job fails (observed in the v0.3.0 tag run
    # `38108069946` — `publish: failure`, `release: skipped`). NOTE: in that run the
    # guard DID run and emit the tag; the skip is GitHub's `needs` rule, not an empty
    # output. Do not "fix" this by moving the gate — the ordering is what keeps a
    # Release from announcing a version that never reached npm.
    if: needs.publish.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # gh release create — scoped to this job, not the publish job
    steps:
      # Same commit the publish job built: the notes must describe the artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.publish.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      # The CHANGELOG heading is `## [0.2.0]` while the tag is `v0.2.0`.
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.publish.outputs.tag }}
        run: node packages/cli/scripts/release-notes.mjs --version "${TAG#v}" --output "$RUNNER_TEMP/notes.md"

      # Idempotent: a workflow_dispatch retry may run after the page already
      # exists (#81's retry path) — updating is a separate, deliberate act.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — leaving it untouched (idempotent retry)."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag
          fi

  # The project page (issue #277). It runs AFTER publish, from the same verified
  # commit, so the page can never describe a version that did not ship: a failed
  # publish skips this job and the page stays at the previous release. The deploy
  # itself lives in `pages.yml`, which is also dispatchable on its own — that is
  # the explicit operator override for a page fix that should not wait a release.
  #
  # Not a `release: published` trigger: `gh release create` above authenticates
  # with GITHUB_TOKEN, and events created by that token do not start workflows
  # (only workflow_dispatch and repository_dispatch do) — the job would never run.
  site:
    needs: publish
    if: needs.publish.outputs.tag != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.publish.outputs.commit }}
      release: ${{ needs.publish.outputs.tag }}
