name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Contract self-test (D3): schema/profile.schema.json must stay valid and
      # keep rejecting/accepting its fixtures. Runs even before the TS workspace exists.
      - name: Validate schema contract (JSON Schema self-test)
        run: |
          python3 -m venv /tmp/schema-venv
          /tmp/schema-venv/bin/pip install --quiet jsonschema
          /tmp/schema-venv/bin/python scripts/schema-check/check.py

      # Issue #149: documentation link gate. Relative links and in-page anchors
      # in the tracked Markdown corpus (README, docs/, CONTRIBUTING, AGENTS,
      # skills/, templates/, package READMEs) must resolve to a file/directory
      # and to a heading of the destination. Offline and deterministic:
      # external URLs are never fetched (walled/anti-bot surfaces answer 403 to
      # bots — #132) and the private family target is DECLARED in
      # scripts/link-check/allowlist.json with its removal trigger. Zero deps,
      # needs no install, so it runs with the always-on contract gates; the
      # fixture self-test runs first and proves the gate refuses a deliberately
      # broken relative link.
      - name: Documentation link gate (offline, self-tested)
        run: |
          node scripts/link-check/test.mjs
          node scripts/link-check/check.mjs

      # TS workspace: these steps activate as soon as package.json lands (M1 core).
      - name: Setup pnpm
        if: hashFiles('package.json') != ''
        uses: pnpm/action-setup@v6 # reads packageManager from package.json

      - name: Setup Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Issue #98: dependency gate (D20 scope rule). The D3 drift-check shape
      # applied to the workspace graph — `packages/server` may depend on core
      # only among its runtime dependencies, and nothing in core's dependency
      # graph may reach `server` (one-directional arrow, SPEC §5). Zero deps,
      # runs before install to fail fast; passes vacuously until
      # `packages/server` lands, then enforces. The self-test first proves the
      # gate itself against fixtures covering both arrows.
      - name: Dependency gate (D20 scope rule)
        if: hashFiles('package.json') != ''
        run: |
          node scripts/dep-gate/test.mjs
          node scripts/dep-gate/check.mjs

      # Issue #165: the platform↔renderer association has one data home — the
      # `pasco` block of each renderer's package.json. The CLI's RENDERERS map is
      # GENERATED from it (`packages/cli/src/generated/renderers.gen.ts`), so a
      # manifest edit without `pnpm gen:renderers` must fail here, not drift
      # silently. The self-test first proves the gate itself against synthesized
      # trees covering every refusal it claims (missing platform, platform
      # outside the schema enum, duplicate, non-member renderer, stale
      # projection). Same D3 drift-check shape as the zod gate below; `--check`
      # also runs the platform membership/one-to-one validation, so a renderer
      # without a resolvable platform can never be skipped. Zero deps, runs
      # before install to fail fast.
      - name: Renderer map in sync with the renderer manifests (#165)
        if: hashFiles('package.json') != ''
        run: |
          node scripts/renderer-map/test.mjs
          node scripts/renderer-map/gen.mjs --check

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: pnpm install --frozen-lockfile

      # Issue #59: style gate — Biome (single tool: lint + format + import order).
      # Runs before tests to fail fast; config in biome.json, `pnpm lint` locally.
      - name: Lint (Biome)
        if: hashFiles('package.json') != ''
        run: pnpm lint

      # D3 freshness: the committed Zod (packages/core/src/generated/schema.zod.ts)
      # must be exactly what the current schema generates — a schema edit without
      # `pnpm gen:zod` must fail here, not drift silently.
      - name: Generated Zod is in sync with the contract (D3)
        if: hashFiles('package.json') != ''
        run: |
          pnpm gen:zod
          git diff --exit-code packages/core/src/generated/schema.zod.ts

      # Issue #108: type gate. Biome is not type-aware (docs/ci-cd.md) and the
      # CLI — the published package — builds with tsup (`dts: false`), which
      # transpiles without checking types, so `pnpm build` alone never
      # type-checks it. `pnpm typecheck` recurses over the whole workspace, but
      # it resolves workspace types from their built `dist/` (core exports ->
      # dist/index.d.ts), which does not exist on a fresh checkout — hence the
      # explicit build right before it. Runs before Test to fail fast.
      - name: Typecheck (tsc strict, whole workspace)
        if: hashFiles('package.json') != ''
        run: pnpm build && pnpm typecheck

      - name: Test
        if: hashFiles('package.json') != ''
        run: pnpm test

      - name: Build
        if: hashFiles('package.json') != ''
        run: pnpm build

      # Issue #43: npm pack --json does not reflect the bin — pack, extract and
      # install the tarball, then smoke-run the linked `pasco` bin.
      - name: Verify tarball exposes bin pasco
        if: hashFiles('package.json') != ''
        run: pnpm --filter @profile-as-code/cli verify:pack

      # Issue #142: validate the published metadata. `verify:pack` proves the
      # bin; publint proves the manifest (files/exports/bin consistency) and
      # attw proves type resolution — publint is also what the CLI's
      # `prepublishOnly` hook runs inside `npm publish` (release.yml), so a
      # metadata regression fails here, at PR time, not only after the
      # irreversible publish. attw stays out of that hook on purpose (its
      # `--pack` mode dies under npm's `--dry-run` env; see docs/ci-cd.md).
      - name: Validate published metadata (publint, every workspace package)
        if: hashFiles('package.json') != ''
        run: pnpm -r exec publint

      # attw runs over the packages that ship types — the set is derived from
      # the manifests, not a hand-maintained list. The detection counts
      # `types`, `typings` and `typesVersions` (all legal shapes): a manifest
      # using an alias must not fall out of a coverage gate silently (review
      # F1 on #156). Two deliberate scopes (issue #142): the CLI is bin-only
      # by design (tsup `dts: false`, no `types` field) and needs no special
      # case here; the typed packages are ESM-only by design, so attw uses
      # `--profile esm-only` — the default strict profile counts
      # CJS-resolves-to-ESM as a problem, which is exactly the state the
      # engine intends.
      - name: Validate published types resolution (attw, typed packages)
        if: hashFiles('package.json') != ''
        run: |
          for dir in packages/* packages/renderers/*; do
            [ -f "$dir/package.json" ] || continue
            grep -qE '"(types|typings)"[[:space:]]*:|"typesVersions"[[:space:]]*:' "$dir/package.json" || continue
            echo "::group::attw $dir"
            pnpm exec attw --pack "$dir" --profile esm-only
            echo "::endgroup::"
          done
