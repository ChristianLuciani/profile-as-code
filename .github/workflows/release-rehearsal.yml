name: release-rehearsal

# Rehearses the seam-cohort publish without publishing anything (issue #313).
#
# The five seam packages publish from release.yml as a loop of `pnpm publish`, and
# that loop's first real cohort publish is an irreversible event (npm cannot
# un-publish). This workflow packs the same five packages with the same client,
# offline, and asserts what the real run depends on: the publish ORDER against the
# workspace dependency graph, the shipped manifests (public access, the `workspace:*`
# rewrite of #301, resolvable entrypoints, `repository.url`), and release.yml's own
# mechanism (pnpm vs npm, OIDC permission, cohort before CLI).
#
# It deliberately does NOT hold `id-token: write`: it cannot exchange a token even
# by accident. What it cannot check — the OIDC exchange, the trusted-publisher
# binding, the registry state, `dist.attestations` — is named in its output and
# closed only by the operator's tagged release (docs/ci-cd.md §"Rehearsing the
# cohort publish"). An operator can run it by hand before preparing a release:
#
#   gh workflow run release-rehearsal.yml --ref main

on:
  pull_request:
    paths:
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - packages/*/package.json
      - packages/*/tsconfig.json
      - .nvmrc
      - .github/workflows/release.yml
      - .github/workflows/release-rehearsal.yml
      - scripts/release-rehearsal/**
      - scripts/dep-gate/check.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # reads packageManager from package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tarballs are packed from `dist`, so the build is part of the
      # rehearsal: a package that does not build cannot publish.
      - name: Build
        run: pnpm build

      - name: Self-test the rehearsal gate
        run: node scripts/release-rehearsal/test.mjs

      - name: Rehearse the seam cohort (packs, publishes nothing)
        run: node scripts/release-rehearsal/check.mjs
