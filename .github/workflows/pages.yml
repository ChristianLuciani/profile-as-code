name: pages

# Publishes the project page (site/) to GitHub Pages.
#
# WHICH REF DEPLOYS: not `main`. The page is the public description of a
# RELEASE, so the release workflow calls this workflow with the exact commit it
# published (issue #277) — a feature merged to `main` never reaches the page
# before the release that ships it. A `workflow_dispatch` run is the explicit
# override: the operator decides to publish (say) a typo fix without cutting a
# release, and the run records that decision.
#
# DEPLOY GATE — the environment allows only `main` and `gh-pages` (measured 2026-10-26,
# `/environments/github-pages/deployment-branch-policies`), so a tag-origin deploy fails on the
# protection rule: v0.3.5's call (`Tag "v0.3.5" is not allowed to deploy to github-pages due to
# environment protection rules`; its publish/Release legs succeeded) and the page recovered with
# this workflow's own dispatch:
#   gh workflow run pages.yml --ref main -f ref=<commit> -f release=<tag>
# (run 40061075031, success; without `release` the footer line is omitted — `gen.mjs` renders
# it only with the label, measured twice). Camino (c) of the #307 docket was **ratified** on
# 2026-10-24 (https://github.com/ChristianLuciani/profile-as-code/issues/307#issuecomment-6386416707) — the tag run is the release
# path and this dispatch is the override — but ratified is not configured: adding a tag policy
# to `github-pages` is the operator's precondition, owned by #327 with the first measurement.
# The page is static and script-free; its documentation pages are projected from
# the Markdown at the deployed commit (`scripts/site-docs/gen.mjs`) into the
# gitignored `site/docs/`, so the repository keeps ONE copy of every document.
#
# Requires the one-time human step: repo Settings → Pages → Source: GitHub
# Actions. While the repository is private the job is skipped, so `main` stays
# green and no failing run is created.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to publish. Empty publishes the ref that triggered the run.
        type: string
        required: false
        default: ''
      release:
        description: Release label for the page footer (e.g. v0.4.0). Empty omits the line.
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to publish. Empty publishes the selected branch.
        type: string
        required: false
        default: ''
      release:
        description: Release label for the page footer (e.g. v0.4.0). Empty omits the line.
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run is not cancelled, so a merge never
# loses the latest site state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # `repository` is absent from some event payloads; treat that as "do not
    # deploy" rather than assuming the site is public.
    if: ${{ github.event.repository != null && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Full history: `sitemap.xml` and each document's "Updated" line read
          # `git log -1 -- <file>`. A shallow clone answers with HEAD's date,
          # which would publish a lying `lastmod` (the generator refuses to
          # guess when it detects a shallow clone, so dates would just vanish).
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Project the docs from the deployed commit, then gate the whole page:
      # ids, in-page anchors and local paths on EVERY page — no `<script>`, no
      # external asset, no `http://`.
      - name: Project the docs and gate the page (#277)
        run: |
          node scripts/site-docs/gen.mjs
          node scripts/site-check/check.mjs
          node scripts/site-check/version-check.mjs
        env:
          SITE_RELEASED_AT: ${{ inputs.release }}
          # Links to documents that are NOT projected must land on the same tree
          # the page describes, not on `main` (which may hold unreleased text).
          SITE_REF: ${{ inputs.ref }}

      # The default GITHUB_TOKEN cannot CREATE the Pages site; `enablement:
      # true` would need a PAT/App token. Enable Pages once after the visibility
      # flip, then run this workflow (or let a release call it):
      #   gh api -X POST repos/ChristianLuciani/profile-as-code/pages -f build_type=workflow
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
