name: Feature request
description: Propose a feature, platform, renderer or skill
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check `docs/SPEC.md` (decisions in §5 — the register, roadmap §12) first — some things are intentionally out of scope.
  - type: textarea
    id: repro
    attributes:
      label: Problem / need (repro)
      description: The user need behind the request, not the solution — the starting point of the workflow.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
      description: How the engine, profile or page should behave once this ships — written so it can be checked.
  - type: textarea
    id: suspected-files
    attributes:
      label: Suspected files
      description: Paths or globs expected to be touched. Write `none` when unknown.
  - type: textarea
    id: adr-lite
    attributes:
      label: Proposed approach (ADR-lite)
      description: Sketch of the solution — what you chose, what you rejected and why. For big changes, expect a spec discussion.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - core
        - schema
        - CLI
        - new renderer (platform)
        - new skill (platform)
        - GEO / i18n
        - CI/CD
        - docs
        - other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Acceptance basics
      options:
        - label: I've read SPEC §2 (goals / non-goals) and my request is not a non-goal
        - label: Quantitative claims I make have a source + date
