version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # pnpm workspace: root package.json + packages/*/package.json
    # esbuild is transitive here (tsup/bundle-require auto-installed peer + vite).
    # Dependabot's npm resolver cannot bump transitive deps pinned in
    # pnpm-lock.yaml, so its security update for esbuild failed 3x with
    # `security_update_not_possible` (2026-09-09/10, issue #57) while the alert
    # stayed open. Decision (issue #57 ADR-lite, option a + real bump): pnpm
    # `overrides: esbuild >=0.28.1` in pnpm-workspace.yaml lifts the pinned
    # vulnerable 0.27.7 to the first patched version (GHSA-g7r4-m6w7-qqqr), and
    # Dependabot skips esbuild — future esbuild bumps ride tsup/vite updates or
    # the weekly manual dependency review (docs/STANDARDS.md, while private).
    # Revisit when Dependabot pnpm support matures (option c).
    ignore:
      - dependency-name: "esbuild"
    # `scripts/dep-gate/fixtures/**` (43 package.json + 20 pnpm-workspace.yaml) is
    # test data: INTENTIONALLY invalid manifests that exist so scripts/dep-gate
    # rejects them. Dependabot scans them as real manifests, aborts the whole
    # update job with `dependency_file_not_parseable` on
    # `fixtures/fail-workspace-nested-key/pnpm-workspace.yaml`, and leaves main
    # with a permanent `failure` run — which also poisons issue-select's gate 5
    # (skills-studio #191). `exclude-paths` is the documented option for exactly
    # this case ("test assets"), on the version-update path the updater runs
    # [WEB: docs.github.com dependabot-options-reference, checked 2026-10-01;
    # failing run 36792749688, 2026-09-30].
    exclude-paths:
      - "scripts/dep-gate/fixtures/**"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["ci"]
