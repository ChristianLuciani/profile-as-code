version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # pnpm workspace: root package.json + packages/*/package.json
    # esbuild is transitive here (tsup/bundle-require auto-installed peer + vite).
    # Dependabot's npm resolver cannot bump transitive deps pinned in
    # pnpm-lock.yaml, so its security update for esbuild failed 3x with
    # `security_update_not_possible` (2026-09-09/10, issue #57) while the alert
    # stayed open. Decision (issue #57 ADR-lite, option a + real bump): pnpm
    # `overrides: esbuild >=0.28.1` in pnpm-workspace.yaml lifts the pinned
    # vulnerable 0.27.7 to the first patched version (GHSA-g7r4-m6w7-qqqr), and
    # Dependabot skips esbuild — future esbuild bumps ride tsup/vite updates or
    # the weekly manual dependency review (docs/STANDARDS.md, while private).
    # Revisit when Dependabot pnpm support matures (option c).
    ignore:
      - dependency-name: "esbuild"
      # #160: same class as esbuild (#57) — source-map-js is transitive (postcss),
      # pinned at 1.2.1 in pnpm-lock.yaml, fixed in 1.2.2 ([OFICIAL] alerts API
      # 2026-10-07: ">= 1.0.0, < 1.2.2", first_patched_version 1.2.2). Dependabot
      # cannot bump a transitive dep pinned there: `security_update_not_possible`
      # (run 37562089307) fails main forever. Real bump = the pnpm override; this
      # stops the impossible retry.
      - dependency-name: "source-map-js"
      # #160: the 20 fixture manifests declare placeholder versions that GitHub
      # advisories flag (19× yaml@1.0.0 + 1× zod@1.0.0 = 20 of the 21 open
      # alerts, [OFICIAL] alerts API 2026-10-07). Those alerts open a SECURITY job
      # over the DISCOVERED fixture workspaces; it aborts with
      # `dependency_file_not_parseable` (run 37562091571, 2026-10-07), poisoning
      # issue-select's gate 5 (main CI-verde; skills-studio #191).
      # `exclude-paths` cannot stop it — it is a VERSION-UPDATES-ONLY option
      # ([OFICIAL] docs.github.com dependabot-options-reference, checked
      # 2026-10-07), so that security job arrives with `"exclude-paths": []`.
      # Pinning the exact placeholder versions keeps the real yaml ^2.9.1 and
      # zod ^4.6.5 updates alive (both resolve outside the affected ranges).
      - dependency-name: "yaml"
        versions: ["1.0.0"]
      - dependency-name: "zod"
        versions: ["1.0.0"]
    # Version-update path only; the security path is covered by the ignores above.
    exclude-paths:
      - "scripts/dep-gate/fixtures/**"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["ci"]
